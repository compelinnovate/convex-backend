services:
  backend:
    # Change this to :${REV} if you want to pin to a specific version
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${PORT:-3210}:3210"
      - "${SITE_PROXY_PORT:-3211}:3211"
    volumes:
      - data:/convex/data
    environment:
      - V8_ACTION_USER_TIMEOUT_SECS
      - NODE_ACTION_USER_TIMEOUT_SECS
      - LOCAL_NODE_EXECUTOR_MAX_OLD_SPACE_SIZE_MIB
      - LOCAL_NODE_EXECUTOR_MAX_RSS_BYTES
      - LOCAL_NODE_EXECUTOR_MEMORY_PRESSURE_MIN_RSS_BYTES
      - LOCAL_NODE_EXECUTOR_MEMORY_PRESSURE_GRACE_SECS
      - LOCAL_NODE_EXECUTOR_MAX_GENERATION_AGE_SECS
      - LOCAL_NODE_EXECUTOR_MAX_IMPORTED_SOURCE_PACKAGES
      - LOCAL_NODE_EXECUTOR_TOTAL_RSS_BUDGET_BYTES
      - LOCAL_BACKEND_NATIVE_KERNEL_MEMORY_RESERVE_BYTES
      - LOCAL_BACKEND_MEMORY_PRESSURE_SHEDDING_ENABLED
      - LOCAL_BACKEND_MEMORY_PRESSURE_ENTER_HEADROOM_BYTES
      - LOCAL_BACKEND_MEMORY_PRESSURE_EXIT_HEADROOM_BYTES
      - LOCAL_BACKEND_MEMORY_RECLAMATION_ENABLED
      - LOCAL_BACKEND_MEMORY_RECLAMATION_ENTER_HEADROOM_BYTES
      - LOCAL_BACKEND_MEMORY_RECLAMATION_EXIT_HEADROOM_BYTES
      - LOCAL_BACKEND_MALLOC_TRIM_ENABLED
      - LOCAL_BACKEND_MALLOC_TRIM_MIN_FREE_BYTES
      - LOCAL_BACKEND_MALLOC_TRIM_COOLDOWN_SECS
      - APPLICATION_MAX_CONCURRENT_DEGRADABLE_QUERY_LEADERS
      - APPLICATION_MAX_CONCURRENT_MUTATIONS=${APPLICATION_MAX_CONCURRENT_MUTATIONS:-16}
      - APPLICATION_MAX_CONCURRENT_NODE_ACTIONS=${APPLICATION_MAX_CONCURRENT_NODE_ACTIONS:-16}
      - APPLICATION_MAX_CONCURRENT_QUERIES=${APPLICATION_MAX_CONCURRENT_QUERIES:-16}
      - APPLICATION_MAX_CONCURRENT_V8_ACTIONS=${APPLICATION_MAX_CONCURRENT_V8_ACTIONS:-16}
      - FUNRUN_ISOLATE_ACTIVE_THREADS
      - FUNRUN_ISOLATE_DEGRADABLE_ACTIVE_THREADS_MIN
      - FUNRUN_ISOLATE_PROTECTED_ACTIVE_THREADS_MIN
      - ISOLATE_CONTROL_PLANE_HARD_MAX_AGE_MILLIS
      - ISOLATE_CONTROL_PLANE_LANE_ENABLED
      - ISOLATE_CONTROL_PLANE_QUEUE_CAPACITY
      - ISOLATE_CONTEXT_CACHE_MAX_RESIDENTS
      - ISOLATE_CONTEXT_CACHE_PROTECTED_RESIDENTS_PER_ISOLATE
      - ISOLATE_DEPENDENCY_WORKER_RESERVE
      - ISOLATE_QUEUE_DELAY_CONTROL_ENABLED
      - ISOLATE_QUEUE_DELAY_INTERVAL_MILLIS
      - ISOLATE_QUEUE_DELAY_SHED_THRESHOLD_MILLIS
      - ISOLATE_QUEUE_DELAY_TARGET_MILLIS
      - ISOLATE_QUEUE_HARD_MAX_AGE_MILLIS
      - ISOLATE_QUEUE_SIZE
      - MAX_ISOLATE_ACTION_WORKERS
      - MAX_ISOLATE_WORKERS
      - AWS_ACCESS_KEY_ID
      - AWS_REGION
      - AWS_S3_DISABLE_CHECKSUMS
      - AWS_S3_DISABLE_SSE
      - AWS_S3_FORCE_PATH_STYLE
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:${PORT:-3210}}
      - CONVEX_RELEASE_VERSION_DEV
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:${SITE_PROXY_PORT:-3211}}
      - DATABASE_URL
      - DISABLE_BEACON
      - DISABLE_METRICS_ENDPOINT=${DISABLE_METRICS_ENDPOINT:-true} # Enable if you want prometheus compatible /metrics endpoint
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800} # Lower default document retention to 2 days
      - DO_NOT_REQUIRE_SSL
      - HTTP_SERVER_TIMEOUT_SECONDS
      - HTTP_SERVER_DEPENDENCY_RESERVE
      - HTTP_SERVER_MAX_CONCURRENT_REQUESTS
      - INSTANCE_NAME
      - INSTANCE_SECRET
      - MYSQL_URL
      - POSTGRES_URL
      - REDACT_LOGS_TO_CLIENT
      - RUST_BACKTRACE
      - RUST_LOG=${RUST_LOG:-info}
      - S3_ENDPOINT_URL
      - S3_STORAGE_EXPORTS_BUCKET
      - S3_STORAGE_FILES_BUCKET
      - S3_STORAGE_MODULES_BUCKET
      - S3_STORAGE_SEARCH_BUCKET
      - S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET

    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  dashboard:
    # Change this to :${REV} if you want to pin to a specific version
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${DASHBOARD_PORT:-6791}:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${NEXT_PUBLIC_DEPLOYMENT_URL:-http://127.0.0.1:${PORT:-3210}}
      - NEXT_PUBLIC_LOAD_MONACO_INTERNALLY
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:
